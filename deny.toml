# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Fail on any unignored security advisory. Add entries to `ignore` ONLY for an
# advisory that is (a) NOT an exploitable vulnerability, (b) in a TRANSITIVE dep
# we don't pull directly, with (c) no available fix short of a major upstream
# bump — and always with the reason + removal condition inline.
#
# The list is empty, and an entry that stops matching any crate is a warning
# cargo-deny prints — read it as the removal condition having been met.
ignore = []

[bans]
# Warn on duplicate versions of the same crate — multiple versions of a dep
# usually indicate a missed dedup opportunity in the Cargo workspace.
#
# Each duplicate the tree cannot shed yet is skipped below, its older version
# named with what holds it. A duplicate not listed warns, and so does a skip
# that stops matching: the cue to drop it. The graph is every platform's, since
# the Rust SDK is linked on any, so those one platform alone compiles are here
# too.
multiple-versions = "warn"
skip = [
    # RustCrypto's 0.10 generation, beside the 0.11 the rest of the tree is on:
    # sqlx-core and sqlx-macros-core 0.9 still hash with sha2 0.10, and
    # opentelemetry-proto's const-hex takes cpufeatures 0.2.
    "block-buffer:0.10", "cpufeatures:0.2", "crypto-common:0.1", "digest:0.10",
    "sha2:0.10",
    # rand 0.9, opentelemetry_sdk's, beside sqlx-postgres's 0.10, each with its
    # own rand_core and getrandom, and ring's getrandom 0.2.
    "getrandom:0.2", "getrandom:0.3", "rand:0.9", "rand_core:0.9",
    # base64 0.23 for lettre; 0.22 for sqlx, reqwest, hyper-util,
    # opentelemetry-proto, auth and shared.
    "base64:0.22",
    # hashbrown 0.16 for sqlx-core and its hashlink; 0.17 for indexmap and
    # clickhouse.
    "hashbrown:0.16",
    # One platform's alone: ring's windows-sys 0.52 on Windows, getrandom 0.3's
    # r-efi 5 on UEFI, and getrandom 0.4's wasip3, with wit-bindgen 0.51, on WASI.
    "r-efi:5", "windows-sys:0.52", "wit-bindgen:0.51",
]
# Deny wildcard dependencies (e.g. foo = "*") — they break reproducibility.
# Cargo workspace `path` deps carry no version by design; they resolve to
# this repo's checkout, so reproducibility isn't at stake for them.
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
# Confidence threshold below which a detected license is treated as unknown.
confidence-threshold = 0.8

# The telmoni-* Cargo workspace crates are unpublished (`publish = false`) and
# declare no `license` of their own — the repository's is Apache-2.0 — so skip
# license checks on them instead of forcing a parseable SPDX expression onto them.
private = { ignore = true }

# Approved SPDX identifiers. Add here when a new dep introduces a new license
# that has been reviewed and approved.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots — the Mozilla CA bundle the rustls stack embeds. A
    # permissive data license (attribution + share-alike for the *data*);
    # reviewed 2026-07-08.
    "CDLA-Permissive-2.0",
    # quoted_printable — lettre's MIME encoder. The BSD Zero Clause license:
    # ISC with the attribution requirement removed, so nothing to carry;
    # reviewed 2026-09-29.
    "0BSD",
    # xxhash-rust — the hash `redis` cannot leave out. The Boost Software
    # License: permissive, attribution in source distributions alone, so
    # nothing to carry in a binary; reviewed 2026-10-10.
    "BSL-1.0",
]

[sources]
# Deny crates from unknown registries or arbitrary git sources.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# Empty, and it must stay that way without a decision. `make deny` passes
# --all-features on purpose: an OPTIONAL git dependency resolves out of a
# default-feature graph, so a plain `cargo deny check` would report "sources
# ok" while checking nothing about it. Keep the flag.
allow-git        = []
