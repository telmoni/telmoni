# Publishes the two images the compose quickstart and the chart pull by name,
# ghcr.io/telmoni/server and ghcr.io/telmoni/web, from a commit on main that
# CI has passed. A registry push is where this ends: nothing here deploys, and
# the only credential is the workflow's own GITHUB_TOKEN, scoped to packages.
#
# `workflow_run` rather than `push`, so an image never leaves a commit CI
# refused. The checkout names the run's head SHA, because `github.sha` here is
# whatever main had moved on to by the time that run finished. The `branches`
# filter alone is not enough: CI also runs for a fork's pull request, under
# whatever branch the fork used — `main`, often — and a run from there carries
# the fork's commit, which this job would build and push as `latest`. So the
# job also asks that the run was a push, to this repository.
#
# amd64 only: the server compiles for x86_64 musl (crates/telmoni/Dockerfile),
# and the console follows it rather than publish a platform the server lacks.
# Actions are on major tags, as in ci.yml — see .github/dependabot.yml.
name: Publish images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# Publishes queue rather than overlap, so `latest` cannot end on the older of
# two commits whose runs crossed. Each image is pushed under its commit's SHA
# alone; `latest` moves for both together, once both are pushed, so a pull
# never pairs a console and a server from two commits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            context: .
            file: crates/telmoni/Dockerfile
          - image: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The commit's SHA, for anyone pinning. The labels tie the package to
      # this repository; `context: git` takes the revision from the checkout,
      # where the workflow's own would name whatever main has moved on to.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=raw,value=${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.version=${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # The image is pushed before the cache is saved, so a cache-service
          # failure should cost the next build its speed, not this publish.
          cache-to: type=gha,mode=max,scope=${{ matrix.image }},ignore-error=true

  # `latest`, for the quickstarts that name no tag, moved to this commit for
  # both images at once, and only when both publishes passed.
  latest:
    name: latest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for image in server web; do
            docker buildx imagetools create --tag "ghcr.io/$OWNER/$image:latest" "ghcr.io/$OWNER/$image:$SHA"
          done
