name: Feature Request
description: Suggest a feature or enhancement for Telmoni
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Telmoni! Please share your idea or enhancement request below.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you encountered.
      placeholder: I am trying to... but currently...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions, workarounds, or features you've considered.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Which component does this touch?
      options:
        - Web Console (web/)
        - Server & REST API (crates/telmoni)
        - Authentication & RBAC (crates/auth)
        - AI Agent & Embeddings (crates/agent)
        - Notifications & Webhooks (crates/notifications)
        - Database & Migrations (crates/migrator)
        - Helm Chart & Kubernetes (deploy/charts/telmoni)
        - Docker Compose (deploy/compose)
        - Developer tooling & Makefile
        - Documentation
      multiple: true
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
