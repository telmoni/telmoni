title: "Q: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask questions about self-hosting, configuring, developing on, or integrating with Telmoni.
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Provide as much context, details, and goal description as possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Telmoni Version / Commit
      description: Version, git commit, or Helm chart version (if applicable).
      placeholder: main (commit abc1234)
    validations:
      required: false
  - type: dropdown
    id: deployment-type
    attributes:
      label: Deployment Environment
      options:
        - Local Development (`make local` / Docker Compose)
        - Kubernetes via Helm chart
        - Standalone Docker containers
        - Bare-metal / systemd
        - Telmoni Cloud
        - Not applicable / general question
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which area does your question relate to?
      options:
        - Self-hosting & Deployment (Docker, Helm, K8s)
        - Configuration & Environment variables
        - Web Console (Next.js)
        - Server Architecture & REST API
        - Database, PostgreSQL roles & Migrations
        - AI Agent & Embeddings (Ollama, hosted models)
        - Connectors, Webhooks & Notifications
        - Authentication & OIDC / SSO
        - Building from source & local development
        - Something else
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing discussions, issues, and documentation to verify this is not already answered.
          required: true
