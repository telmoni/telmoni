global:
  # Where the server and web images are pulled from: the ones this repository
  # publishes, so the chart installs as it ships. A deployment with its own
  # registry points this at it.
  imageRegistry: "ghcr.io/telmoni"
  imageTag: "latest"
  imagePullPolicy: IfNotPresent

config:
  logLevel: "info"
  appUrl: "http://localhost:3000"
  authUrl: "http://localhost:3000"
  oidcRedirectUri: "http://localhost:3000/auth/callback"
  # The login form is on unless disableLoginForm, which needs the OpenID
  # Connect provider in `server-secrets`. Password sign-ups are closed unless
  # allowSignUp (an invited address may still sign up): the first account
  # comes from ADMIN_EMAIL and ADMIN_PASSWORD in `server-secrets`, and invites
  # the rest. The provider's first sign-ins make accounts while
  # oidcAllowSignUp is on; off, it refuses every identity the provider has
  # not brought before, invited or not, so with the form off nobody new gets
  # in at all. Whether a new person gets an organization, and whether anyone
  # may create another, is the global `signup` feature flag, which is what an
  # invitation-only deployment turns off. verifyEmail has a new account
  # confirm its address from a mail first, which needs SMTP_URL.
  allowSignUp: false
  verifyEmail: false
  disableLoginForm: false
  # What the sign-in page calls the OpenID Connect provider ("Continue with
  # …"); whether a person it names for the first time becomes an account
  # here; and whether one whose address an account here already holds is
  # taken to be that account, which trusts the provider to have proved it.
  oidcName: ""
  oidcAllowSignUp: true
  oidcAllowInsecureEmailLookup: false
  # The identity provider's origins, space separated: signing out from the
  # account menu is a form post that ends in a redirect to the provider, and
  # the console's Content Security Policy lets the browser follow it only here. Empty allows only
  # the console itself (sign-in is a link, which the policy does not govern).
  authProviderOrigins: ""
  # Who runs this deployment: the company on the console's copyright line,
  # the address the console and auth's mail offer, and the base under which
  # the operator publishes `privacy-policy` and `terms-of-service`. Empty
  # names nobody and offers no document.
  companyName: ""
  supportEmail: ""
  legalUrl: ""
  mailFrom: "Telmoni <no-reply@localhost>"
  connectorKek: "local:dev_key"
  # The console agent. Off while modelProvider is empty; on, it needs
  # `AGENT_DATABASE_URL` in `server-secrets` (the `agent` role's DSN), and
  # `AGENT_MODEL_API_KEY` there for a hosted model. modelProvider is the
  # protocol: `anthropic` (model defaults to claude-sonnet-5) or `openai`
  # (Chat Completions: OpenAI, Gemini's compatible endpoint, vLLM, …; name
  # the model, and the URL is the `/v1` base). embeddingsUrl empty with
  # `embeddings.enabled` is the chart's own Ollama; a hosted endpoint takes
  # `EMBEDDINGS_API_KEY` in `server-secrets`, and embeddingsRequestDimensions
  # for a model wider than 768 by default. The server refuses to start with
  # an embedding model of another width.
  agent:
    modelProvider: ""
    modelUrl: ""
    model: ""
    embeddingsUrl: ""
    embeddingsModel: "nomic-embed-text"
    embeddingsRequestDimensions: false
    # A rerank endpoint over the top 30 results; its key is `RERANK_API_KEY`.
    rerankUrl: ""
    rerankModel: ""
    # Empty is the console's own `/llms-full.txt`, reached inside the cluster
    # (the `web` Service), so the docs are the version this release runs;
    # `off` indexes no docs.
    docsCorpusUrl: ""
    messagesPerHour: 60

# An Ollama serving the agent's embedding model inside the cluster, for a
# tier that keeps embeddings off a vendor. It pulls the model at start into
# an emptyDir, so a new pod downloads it again; the server reaches it at
# http://embeddings:11434/v1. The image is pinned to a release, never
# `latest`: a pod that restarts must come back on the Ollama it left, not on
# whatever was published since. Bump it on purpose, with the chart.
embeddings:
  enabled: false
  image: "ollama/ollama:0.40.1"
  model: "nomic-embed-text"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# `extraEnv` is appended to the container's `env`, for a deployment that
# needs a variable the chart does not name.
web:
  enabled: true
  image: "web"
  replicas: 1
  # How many entries the proxies in front of the console append to
  # X-Forwarded-For, where it finds the one client address no caller wrote
  # and keys its per-address rate limits: the GKE Gateway appends the
  # client's address and then its own.
  trustedProxyHops: 2
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The server: auth, notifications, telemetry and the agent in one process,
# with the deletion, retention and audit sweeps on its own timers
# (`RUN_SWEEPS=false` in `extraEnv` leaves them to jobs of your own). It reads
# its secrets from a Secret named `server-secrets` the operator creates beside
# the chart: `AUTH_DATABASE_URL`, `NOTIFICATIONS_DATABASE_URL`,
# `TELEMETRY_DATABASE_URL` and, for the agent, `AGENT_DATABASE_URL` (one DSN
# per module, each as its own role), `TELEMETRY_CLICKHOUSE_URL` (ClickHouse's
# HTTP interface, as the module's own user, carrying its user and password
# as a DSN does: `https://telemetry:password@clickhouse.example.com:8443`,
# or `http://` to a Service in the cluster by its name and namespace, which
# a pod requires of plain http, and which needs NetworkPolicies of your own:
# templates/network-policies.yaml), the
# agent's `AGENT_MODEL_API_KEY`, `EMBEDDINGS_API_KEY` and `RERANK_API_KEY`
# when its endpoints need them, `SERVICE_SECRET`, `ADMIN_EMAIL` and `ADMIN_PASSWORD`
# for the first account, `OIDC_ISSUER`, `OIDC_CLIENT_ID` and `OIDC_CLIENT_SECRET` for an
# OpenID Connect provider beside the login form, `SMTP_URL`
# (`smtps://user:password@host:465`) for the mail it sends — without it nothing
# is sent, one log line per mail and no contents — the `SLACK_*` and `DISCORD_*`
# apps, and `DATABASE_CA_CERT`.
server:
  enabled: true
  image: "server"
  replicas: 1
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The migration Job and the nightly rotation CronJob — Postgres's audit
# partitions, and ClickHouse's days of spans and months of totals past
# retention — run the server's image as the migrator, from a Secret named
# `migrator-secrets` holding `MIGRATOR_DATABASE_URL`, `MIGRATOR_CLICKHOUSE_URL`
# (its ClickHouse user, the one `tenant_isolation` does not hold) and
# `DATABASE_CA_CERT`. ClickHouse is the operator's, as Postgres is: one node,
# and the chart runs none (`crates/telemetry/clickhouse/low-memory.xml` is
# the configuration to give it).
migrator:
  enabled: true
  hook:
    enabled: true
  rotateSchedule: "0 2 * * *"

highAvailability:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCpuUtilization: 70

ingress:
  enabled: false
  gatewayClassName: "gke-l7-global-external-managed"
  staticAddressName: "telmoni-web"
  annotations:
    networking.gke.io/certmap: "telmoni-web"
