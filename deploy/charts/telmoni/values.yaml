global:
  # Where the server and web images are pulled from: the ones this repository
  # publishes, so the chart installs as it ships. A deployment with its own
  # registry points this at it.
  imageRegistry: "ghcr.io/telmoni"
  # The full SHA of the commit this chart is checked out at, for both images
  # (each commit CI passed on main is published under its SHA). Required: a
  # moving tag leaves each node on the one it pulled first.
  imageTag: ""
  imagePullPolicy: IfNotPresent

config:
  logLevel: "info"
  appUrl: "http://localhost:3000"
  authUrl: "http://localhost:3000"
  # One callback for every provider (AUTH_REDIRECT_URI).
  redirectUri: "http://localhost:3000/auth/callback"
  # The login form is on unless disableUsernamePassword, which needs the
  # OpenID Connect provider in `server-secrets`. Nobody new
  # signs up, at the form or at a provider, unless disableSignup is false; an
  # invited address always may, at a provider one it verified: the first
  # account comes from ADMIN_EMAIL and ADMIN_PASSWORD in `server-secrets`, and
  # invites the rest. Addresses at the domains of domainsWithSsoEnforcement
  # (comma separated) sign in at the provider alone. Whether a new person gets
  # an organization, and whether anyone may create another, is the global
  # `signup` feature flag, which is what an invitation-only deployment turns
  # off. verifyEmail has a new account confirm its address from a mail
  # first, which needs SMTP_URL.
  disableSignup: true
  verifyEmail: false
  disableUsernamePassword: false
  domainsWithSsoEnforcement: ""
  # Where every person created starts (TELMONI_DEFAULT_*): an organization's
  # id, from its Settings,
  # joined as a member unless defaultOrgRole is admin, and one of its
  # projects, seated as a member unless defaultProjectRole is admin. Once, as
  # they are created; empty for none.
  defaultOrgId: ""
  defaultOrgRole: ""
  defaultProjectId: ""
  defaultProjectRole: ""
  # The OpenID Connect provider's block (AUTH_CUSTOM_*), its client id,
  # secret and issuer in `server-secrets`: what the sign-in page calls it
  # ("Continue with …"); the scopes it is asked for; what each sign-in is
  # held to, of pkce, nonce and state; the one algorithm its id tokens may
  # carry; whether userinfo is read beside them; and whether an unknown
  # subject whose address an account here holds is taken to be that account,
  # where the provider verified the address and the account proved it.
  customName: ""
  customScope: "openid email profile"
  customChecks: "pkce,nonce,state"
  customIdTokenSignedResponseAlg: "RS256"
  customFetchUserinfo: false
  customAllowAccountLinking: false
  # The identity provider's origins, space separated: signing out from the
  # account menu is a form post that ends in a redirect to the provider, and
  # the console's Content Security Policy lets the browser follow it only here. Empty allows only
  # the console itself (sign-in is a link, which the policy does not govern).
  authProviderOrigins: ""
  # Who runs this deployment: the company on the console's copyright line,
  # the address the console and auth's mail offer, and the base under which
  # the operator publishes `privacy-policy` and `terms-of-service`. Empty
  # names nobody and offers no document.
  companyName: ""
  supportEmail: ""
  legalUrl: ""
  mailFrom: "Telmoni <no-reply@localhost>"
  connectorKek: "local:dev_key"
  # The key each project's hashing key is sealed under, which the user ids
  # its spans carry are hashed with. A Cloud KMS key name in a pod, as
  # `connectorKek` is; required, where that one may be empty.
  telemetryKek: "local:dev_key"
  # The console agent. Off while modelProvider is empty; on, it needs
  # `AGENT_DATABASE_URL` in `server-secrets` (the `agent` role's DSN), and
  # `AGENT_MODEL_API_KEY` there for a hosted model. modelProvider is the
  # protocol: `anthropic` (model defaults to claude-sonnet-5) or `openai`
  # (Chat Completions: OpenAI, Gemini's compatible endpoint, vLLM, …; name
  # the model, and the URL is the `/v1` base). embeddingsUrl empty with
  # `embeddings.enabled` is the chart's own Ollama; a hosted endpoint takes
  # `EMBEDDINGS_API_KEY` in `server-secrets`, and embeddingsRequestDimensions
  # for a model wider than 768 by default. The server refuses to start with
  # an embedding model of another width.
  agent:
    modelProvider: ""
    modelUrl: ""
    model: ""
    embeddingsUrl: ""
    embeddingsModel: "nomic-embed-text"
    embeddingsRequestDimensions: false
    # A rerank endpoint over the top 30 results; its key is `RERANK_API_KEY`.
    rerankUrl: ""
    rerankModel: ""
    # Empty is the console's own `/llms-full.txt`, reached inside the cluster
    # (the `web` Service), so the docs are the version this release runs;
    # `off` indexes no docs.
    docsCorpusUrl: ""
    messagesPerHour: 60

# An Ollama serving the agent's embedding model inside the cluster, for a
# tier that keeps embeddings off a vendor. It pulls the model at start into
# an emptyDir, so a new pod downloads it again; the server reaches it at
# http://embeddings:11434/v1. The image is pinned to a release, never
# `latest`: a pod that restarts must come back on the Ollama it left, not on
# whatever was published since. Bump it on purpose, with the chart.
embeddings:
  enabled: false
  image: "ollama/ollama:0.40.1"
  model: "nomic-embed-text"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# `extraEnv` is appended to the container's `env`, for a deployment that
# needs a variable the chart does not name.
web:
  enabled: true
  image: "web"
  replicas: 1
  # How many entries the proxies in front append to X-Forwarded-For, where
  # the one client address no caller wrote is found and the per-address rate
  # limits are keyed — the console's, and the server's on the machine lanes,
  # which read the same count from the ConfigMap, since both sit behind the
  # same Gateway: it appends the client's address and then its own.
  trustedProxyHops: 2
  # Seconds a page reading a project's spans — a trace's or a session's page,
  # or a Sessions or Users list — holds between redraws as they arrive (the
  # server tells the console on Redis): the first export after a quiet spell
  # draws at once, the rest once, when the hold ends; the Traces list counts
  # them in a bar instead. 0 draws on every export.
  liveRefreshHoldSeconds: 30
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# The server: auth, notifications, telemetry and the agent in one process,
# with the deletion, retention and audit sweeps on its own timers
# (`RUN_SWEEPS=false` in `extraEnv` leaves them to jobs of your own). It reads
# its secrets from a Secret named `server-secrets` the operator creates beside
# the chart: `AUTH_DATABASE_URL`, `NOTIFICATIONS_DATABASE_URL`,
# `TELEMETRY_DATABASE_URL` and, for the agent, `AGENT_DATABASE_URL` (one DSN
# per module, each as its own role), `TELEMETRY_CLICKHOUSE_URL` (ClickHouse's
# HTTP interface, as the module's own user, carrying its user and password
# as a DSN does: `https://telemetry:password@clickhouse.example.com:8443`,
# or `http://` to a Service in the cluster by its name and namespace, which
# a pod requires of plain http, and which needs NetworkPolicies of your own:
# templates/network-policies.yaml), `REDIS_URL` (the console's Redis, which
# ingest's claims on each export and its rate limits share), the
# agent's `AGENT_MODEL_API_KEY`, `EMBEDDINGS_API_KEY` and `RERANK_API_KEY`
# when its endpoints need them, `TELMONI_API_KEY` (an ingest key of a project
# of your own: the console agent reports its questions as that project's runs
# with the Rust SDK, to this server's own door, as any agent does),
# `SERVICE_SECRET`, `ADMIN_EMAIL` and `ADMIN_PASSWORD`
# for the first account, `AUTH_CUSTOM_ISSUER`, `AUTH_CUSTOM_CLIENT_ID` and
# `AUTH_CUSTOM_CLIENT_SECRET` for an OpenID Connect provider beside the login form, `SMTP_URL`
# (`smtps://user:password@host:465`) for the mail it sends — without it nothing
# is sent, one log line per mail and no contents — the `SLACK_*` app, and
# `DATABASE_CA_CERT`.
server:
  enabled: true
  image: "server"
  replicas: 1
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The migration Job and the nightly rotation CronJob — Postgres's audit
# partitions, and ClickHouse's days of spans and months of totals past
# retention — run the server's image as the migrator, from a Secret named
# `migrator-secrets` holding `MIGRATOR_DATABASE_URL`, `MIGRATOR_CLICKHOUSE_URL`
# (its ClickHouse user, the one `tenant_isolation` does not hold) and
# `DATABASE_CA_CERT`. ClickHouse is the operator's, as Postgres is: one node,
# and the chart runs none (`crates/telemetry/clickhouse/low-memory.xml` is
# the configuration to give it).
migrator:
  enabled: true
  hook:
    enabled: true
  rotateSchedule: "0 2 * * *"

highAvailability:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCpuUtilization: 70

ingress:
  enabled: false
  gatewayClassName: "gke-l7-global-external-managed"
  staticAddressName: "telmoni-web"
  annotations:
    networking.gke.io/certmap: "telmoni-web"
  # The machine lanes — ingest at /otlp/v1/traces, the read API under /v1,
  # the CLI's under /cli/v1 and Slack's events at /webhooks/v1/slack — and the
  # external watchdog's /heartbeat go to the `server-api` Service: on a host of
  # their own named here (`api.telmoni.example.com`, then the SDKs'
  # endpoint), whose certificate the map above must hold too; or, empty,
  # under their paths on the console's host, which is then the endpoint.
  # Either way only the lanes' paths reach the server from outside.
  apiHost: ""
  # The share of the lanes' requests the load balancer logs, in millionths:
  # every one by default, as the console's.
  apiLogSampleRate: 1000000
