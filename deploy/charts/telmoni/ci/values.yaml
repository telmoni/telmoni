# What the gates render the chart with (make deploy-check, CI's deploy-check
# job, a wrapping chart's own check): the values it requires, which ship empty.
global:
  imageTag: check
config:
  telemetryKek: file:/var/run/secrets/telmoni/kek/telemetry
  contentKek: file:/var/run/secrets/telmoni/kek/content
