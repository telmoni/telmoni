{{- if .Values.networkPolicies.enabled }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: default-deny-all
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Where the cluster runs NodeLocal DNSCache, as GKE does, a pod's lookups are
# answered by the cache's pods, which carry a label of their own.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-kube-dns
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: node-local-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The server takes the console's calls and, on the machine lanes, the world's:
# the load balancer reaches its pods directly (container-native), from
# addresses no selector can name, as it reaches the console's. Each lane has
# a gate of its own — the service secret, or a project API key — and the
# modules reach each other inside the process; nothing calls the jobs.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-server-ingress
  labels:
    app.kubernetes.io/name: server
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8082
---
# The console is the front door: the load balancer reaches its pods directly
# (container-native), from addresses no selector can name.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-web-ingress
  labels:
    app.kubernetes.io/name: web
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
---
# The console calls the server and its rate limiter's Redis, nothing else.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-web-egress
  labels:
    app.kubernetes.io/name: web
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6378
        - protocol: TCP
          port: 6379
    {{- range .Values.networkPolicies.stores }}
    {{- if .web }}
    - to:
        - {{ include "telmoni.storePeer" . | nindent 10 | trim }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
---
# The server and the jobs leave the cluster for everything they use: the
# database, ClickHouse, Redis, the mail and sign-in vendors, the KMS key,
# and a customer's webhook on whatever port it names. A store inside the
# cluster is admitted by selector (`networkPolicies.stores`), since an address
# block is not matched against a pod's address everywhere. The server's own
# URL guard (crates/shared/src/net_guard.rs) refuses private addresses, which
# a policy cannot tell from the database's.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-server-and-jobs-egress
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [server, migrator]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- range .Values.networkPolicies.stores }}
    - to:
        - {{ include "telmoni.storePeer" . | nindent 10 | trim }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
# The server reads the docs it answers from off the console (`DOCS_CORPUS_URL`),
# named as the embeddings are, since the address block above is no pod's.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-server-to-web
  labels:
    app.kubernetes.io/name: server
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 3000
{{- range .Values.networkPolicies.stores }}
{{- if not .namespaceSelector }}
---
# A store in this namespace, which `default-deny-all` closes, opened to its
# clients alone.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-store-{{ .name }}
  labels:
    {{- include "telmoni.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ if .web }}[server, migrator, web]{{ else }}[server, migrator]{{ end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
{{- end }}
{{- end }}
{{- end }}
