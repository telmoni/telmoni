kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: default-deny-all
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-kube-dns
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The console is the server's one caller: auth and notifications reach each
# other inside the process, and nothing calls the jobs.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-server-ingress
  labels:
    app.kubernetes.io/name: server
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - protocol: TCP
          port: 8082
---
# The console is the front door: the load balancer reaches its pods directly
# (container-native), from addresses no selector can name.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-web-ingress
  labels:
    app.kubernetes.io/name: web
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
---
# The console calls the server and its rate limiter's Redis, nothing else.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-web-egress
  labels:
    app.kubernetes.io/name: web
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
      ports:
        - protocol: TCP
          port: 8082
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6378
        - protocol: TCP
          port: 6379
---
# The server and the jobs leave the cluster for everything they use: the
# database, ClickHouse, the mail and sign-in vendors, the KMS key, and a
# customer's webhook on whatever port it names. A ClickHouse inside the
# cluster needs policies of its own: egress to it by pod and namespace
# selector, since an address block is not matched against a pod's address
# everywhere, and, in this namespace, ingress to it, which
# `default-deny-all` refuses. The server's own URL guard
# (crates/shared/src/net_guard.rs) refuses private addresses, which a policy
# cannot tell from the database's.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-server-and-jobs-egress
  labels:
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [server, migrator]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
