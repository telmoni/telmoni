apiVersion: v1
kind: ConfigMap
metadata:
  name: telmoni-tier
  labels:
    app.kubernetes.io/component: config
    {{- include "telmoni.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # One count for the console and the server: both sit behind the same
  # Gateway, and each keys its per-address limits on the address that many
  # X-Forwarded-For entries back from the end.
  TRUSTED_PROXY_HOPS: {{ .Values.web.trustedProxyHops | quote }}
  LIVE_REFRESH_HOLD_SECS: {{ .Values.web.liveRefreshHoldSeconds | quote }}
  APP_URL: {{ .Values.config.appUrl | quote }}
  AUTH_URL: {{ .Values.config.authUrl | quote }}
  AUTH_REDIRECT_URI: {{ .Values.config.redirectUri | quote }}
  AUTH_DISABLE_SIGNUP: {{ .Values.config.disableSignup | quote }}
  VERIFY_EMAIL: {{ .Values.config.verifyEmail | quote }}
  AUTH_DISABLE_USERNAME_PASSWORD: {{ .Values.config.disableUsernamePassword | quote }}
  AUTH_DOMAINS_WITH_SSO_ENFORCEMENT: {{ .Values.config.domainsWithSsoEnforcement | quote }}
  TELMONI_DEFAULT_ORG_ID: {{ .Values.config.defaultOrgId | quote }}
  TELMONI_DEFAULT_ORG_ROLE: {{ .Values.config.defaultOrgRole | quote }}
  TELMONI_DEFAULT_PROJECT_ID: {{ .Values.config.defaultProjectId | quote }}
  TELMONI_DEFAULT_PROJECT_ROLE: {{ .Values.config.defaultProjectRole | quote }}
  AUTH_CUSTOM_NAME: {{ .Values.config.customName | quote }}
  AUTH_CUSTOM_SCOPE: {{ .Values.config.customScope | quote }}
  AUTH_CUSTOM_CHECKS: {{ .Values.config.customChecks | quote }}
  AUTH_CUSTOM_ID_TOKEN_SIGNED_RESPONSE_ALG: {{ .Values.config.customIdTokenSignedResponseAlg | quote }}
  AUTH_CUSTOM_FETCH_USERINFO: {{ .Values.config.customFetchUserinfo | quote }}
  AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING: {{ .Values.config.customAllowAccountLinking | quote }}
  AUTH_PROVIDER_ORIGINS: {{ .Values.config.authProviderOrigins | quote }}
  COMPANY_NAME: {{ .Values.config.companyName | quote }}
  SUPPORT_EMAIL: {{ .Values.config.supportEmail | quote }}
  LEGAL_URL: {{ .Values.config.legalUrl | quote }}
  MAIL_FROM: {{ .Values.config.mailFrom | quote }}
  CONNECTOR_KEK: {{ .Values.config.connectorKek | quote }}
  TELEMETRY_KEK: {{ .Values.config.telemetryKek | quote }}
  {{- with .Values.config.agent }}
  AGENT_MODEL_PROVIDER: {{ .modelProvider | quote }}
  AGENT_MODEL_URL: {{ .modelUrl | quote }}
  AGENT_MODEL: {{ .model | quote }}
  EMBEDDINGS_URL: {{ .embeddingsUrl | default (ternary "http://embeddings:11434/v1" "" $.Values.embeddings.enabled) | quote }}
  EMBEDDINGS_MODEL: {{ .embeddingsModel | quote }}
  EMBEDDINGS_REQUEST_DIMENSIONS: {{ .embeddingsRequestDimensions | quote }}
  RERANK_URL: {{ .rerankUrl | quote }}
  RERANK_MODEL: {{ .rerankModel | quote }}
  DOCS_CORPUS_URL: {{ .docsCorpusUrl | default "http://web:3000/llms-full.txt" | quote }}
  AGENT_MESSAGES_PER_HOUR: {{ .messagesPerHour | quote }}
  {{- end }}
