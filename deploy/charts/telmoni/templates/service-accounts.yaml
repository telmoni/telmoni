apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: server
    {{- include "telmoni.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
    {{- include "telmoni.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrator
  labels:
    app.kubernetes.io/name: migrator
    app.kubernetes.io/component: migrator
    {{- include "telmoni.labels" . | nindent 4 }}
  {{- if and .Values.migrator.enabled .Values.migrator.hook.enabled }}
  {{- include "telmoni.migrateHookPrereq" . | nindent 2 }}
  {{- end }}
