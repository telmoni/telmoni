{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  {{- if not .Values.highAvailability.enabled }}
  # The autoscaler owns the count when there is one; a set count here would
  # put it back on every upgrade.
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      # A changed value rolls the pods, which read the ConfigMap at start.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: server
        {{- include "telmoni.labels" . | nindent 8 }}
    spec:
      serviceAccountName: server
      # The endpoint leaves the Service and the load balancer a few seconds
      # after the kill, so the pod serves through preStop, then drains.
      terminationGracePeriodSeconds: 45
      {{- if .Values.highAvailability.enabled }}
      {{- include "telmoni.spread" "server" | nindent 6 }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "telmoni.image" (dict "root" . "name" .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["serve"]
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: telmoni-tier
            - secretRef:
                name: server-secrets
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The server binds once its pools connect and the embeddings probe
          # answers, so a slow boot gets 90 s before liveness counts.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 45
          # Liveness is process-up only; readiness reaches every module's
          # tables, so a pod whose role lost a grant takes no traffic.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            # Past the pools' 5 s acquire, so a busy pool is slow, not unready.
            timeoutSeconds: 6
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: server
  labels:
    app.kubernetes.io/name: server
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 8082
      targetPort: http
---
# The machine lanes' own door: a second Service over the same pods, so a
# route from outside reaches the server here, and a deployment can give it a
# backend policy of its own, apart from the console's and from any other
# route it sends to `server`.
apiVersion: v1
kind: Service
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: api
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
  ports:
    - name: http
      port: 8082
      targetPort: http
{{- end }}
