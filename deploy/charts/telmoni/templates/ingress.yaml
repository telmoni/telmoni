{{- if .Values.ingress.enabled }}
{{- if and .Values.ingress.apiHost (regexMatch "^(localhost|127\\.[0-9.]+|\\[::1\\])(:[0-9]+)?$" (urlParse .Values.config.appUrl).host) }}
{{- fail "ingress.apiHost needs config.appUrl on the console's public host, which its route is held to" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.ingress.gatewayClassName | default "gke-l7-global-external-managed" }}
  addresses:
    - type: NamedAddress
      value: {{ .Values.ingress.staticAddressName | default "telmoni-web" }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: web
      sectionName: https
  {{- /* With a machine host of its own, the console answers on its host
  alone: a route naming none would take every path of the machine host the
  lanes do not, and serve the console to machines there. */}}
  {{- if .Values.ingress.apiHost }}
  hostnames:
    - {{ regexReplaceAll ":[0-9]+$" (urlParse .Values.config.appUrl).host "" | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: web
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-https-redirect
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: web
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 3000
        requestPath: /api/health
  targetRef:
    group: ""
    kind: Service
    name: web
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  default:
    timeoutSec: 3600
    logging:
      enabled: true
      sampleRate: 1000000
    connectionDraining:
      drainingTimeoutSec: 30
  targetRef:
    group: ""
    kind: Service
    name: web
---
# The machine lanes — ingest at /otlp/v1/traces, the read API under /v1, the
# CLI's under /cli/v1 and Slack's signed events at /webhooks/v1/slack — and the
# external watchdog's /heartbeat on `server-api`: on a host of their own where
# `ingress.apiHost` names one, else under their paths on the console's host,
# whose slugs are reserved so no organization shadows them. Only the lanes'
# paths reach the server from outside; the console's `/internal/v1`, behind
# the service secret, never does. Each prefix takes the lane's every version,
# so a path missing one gets the server's 404. A matched path outranks the
# console's catch-all, and a named host a route naming none.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: web
      sectionName: https
  {{- with .Values.ingress.apiHost }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /otlp
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /cli
        - path:
            type: Exact
            value: /webhooks/v1/slack
        - path:
            type: Exact
            value: /heartbeat
      backendRefs:
        - name: server-api
          port: 8082
---
# The load balancer's own check of the machine lanes' backend: liveness,
# which touches no database, so a database blip does not also refuse the
# exporters' retries; readiness already takes a pod out of the Service.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        port: 8082
        requestPath: /livez
  targetRef:
    group: ""
    kind: Service
    name: server-api
---
# Draining lets an export in flight finish on a stopping pod: the load
# balancer never retries a POST, so one cut short is lost.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: server-api
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/component: ingress
    {{- include "telmoni.labels" . | nindent 4 }}
spec:
  default:
    logging:
      enabled: true
      sampleRate: {{ .Values.ingress.apiLogSampleRate | int }}
    connectionDraining:
      drainingTimeoutSec: 30
  targetRef:
    group: ""
    kind: Service
    name: server-api
{{- end }}
