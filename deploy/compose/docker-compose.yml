# Telmoni self-hosted, with Docker Compose: the server, the console, Postgres,
# ClickHouse and Redis — five containers, plus the one-shot migration that
# runs first.
#
# Quickstart:
#   1. cp deploy/compose/.env.example deploy/compose/.env, and fill its first
#      five, which have no default: `up` refuses to start without them.
#      SERVICE_SECRET (any random string; both processes get the same one),
#      AUTH_SECRET (the console's cookie seal, 32 bytes or more),
#      POSTGRES_PASSWORD and CLICKHOUSE_PASSWORD (each store's one user's; a
#      default here would be the same on every install, and each goes into a
#      URL, so hex), and TELEMETRY_KEK=local:<openssl rand -hex 32>, which
#      seals the key each project's user ids are hashed under: a secret
#      to back up beside the database, since a dump restored without it
#      leaves every stored user id matching nothing new:
#        openssl rand -hex 32
#      Connectors (Slack, webhooks) stay off until a sixth is set,
#      CONNECTOR_KEK=local:<openssl rand -hex 32>, which seals their grants
#      at rest: a secret to back up beside the database, since a dump
#      restored without it leaves every grant unreadable.
#   2. Run: docker compose -f deploy/compose/docker-compose.yml up -d --wait
#      (--wait fails when a container exits, as one with a bad value does).
#   3. The console answers on 127.0.0.1:3000, and the machine lanes — ingest
#      at /otlp/v1/traces, where the SDKs send; the read API under /v1; the
#      CLI's sign-in under /cli/v1; Slack's events at /webhooks/v1/slack; the
#      heartbeat at /heartbeat — on 127.0.0.1:8082; the reverse proxy in front
#      (telmoni.com/docs/self-host/production) forwards each.
#
# Upgrading: pin both images to one commit (TELMONI_IMAGE_SERVER and
# TELMONI_IMAGE_WEB), move the pin, then `pull`, `run --rm migrate` and
# `up -d --wait`, so a refused migration leaves the running stack as it was.
# Before Telmoni's first release its migrations are edited in place, and an
# upgrade across such an edit needs both stores made again (`down -v`).
#
# The server runs its own sweeps on a timer (the deletion saga, retention, the
# daily audit walk, the audit exports' retries and expiry), so nothing here
# schedules them. The audit partitions are rotated, and the days of spans
# and months of totals past retention dropped, by hand or from your own
# cron, nightly:
#   docker compose -f deploy/compose/docker-compose.yml run --rm migrate rotate
#
# The console's agent is off until AGENT_MODEL_PROVIDER is set. Its
# embeddings come from the `ollama` service, started with the `agent`
# profile, which needs its model pulled once:
#   docker compose -f deploy/compose/docker-compose.yml --profile agent up -d
#   docker compose -f deploy/compose/docker-compose.yml exec ollama ollama pull nomic-embed-text

name: telmoni-selfhost

networks:
  telmoni-net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  ollama_models:

x-database-url: &database_url
  postgres://${POSTGRES_USER:-telmoni}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}@postgres:5432/${POSTGRES_DB:-telmoni}

x-clickhouse-url: &clickhouse_url
  http://${CLICKHOUSE_USER:-telmoni}:${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/compose/.env}@clickhouse:8123

# Docker's `local` driver rotates each container's log, where its default
# keeps every line, and a long-running host fills its disk.
x-logging: &logging
  driver: local

services:
  postgres:
    # Postgres 17 with pgvector, which the agent's search needs; the
    # extension is installed once, when the volume is first created.
    image: pgvector/pgvector:0.8.7-pg17
    container_name: telmoni-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telmoni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-telmoni}
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../crates/migrator/sql/dev_extensions.sql:/docker-entrypoint-initdb.d/05-extensions.sql:ro
    networks:
      - telmoni-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telmoni} -d ${POSTGRES_DB:-telmoni}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Telemetry's spans and their hourly rollup: one node, kept small by the
  # settings every ClickHouse here runs
  # (`crates/telemetry/clickhouse/low-memory.xml`) and capped at the memory
  # below, which ClickHouse takes as its ceiling; raise it on a bigger host.
  # One user, as Postgres has one, running the migration and the server
  # both, so `tenant_isolation` holds nobody here, as no row-level security
  # holds Postgres's one user, and each read's own WHERE is the lock. It
  # creates the database's row policies and view as `migrate` runs, which
  # needs access management.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.19.9
    container_name: telmoni-clickhouse
    restart: unless-stopped
    logging: *logging
    mem_limit: 1536m
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-telmoni}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/compose/.env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../crates/telemetry/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - telmoni-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: telmoni-redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --save "" --loglevel warning
    networks:
      - telmoni-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The same image as the server, run once with `migrate`: every schema's
  # DDL and the model prices before the server starts, then ClickHouse's
  # database and tables. This quickstart runs everything as the one database
  # user, which owns every table and needs no grant; a deployment that gives
  # each module its own role (`role_hardening.sql`) gets the object grants
  # from the same run.
  migrate:
    image: ${TELMONI_IMAGE_SERVER:-ghcr.io/telmoni/server:latest}
    command: ["migrate"]
    restart: "no"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - telmoni-net
    environment:
      MIGRATOR_DATABASE_URL: *database_url
      MIGRATOR_CLICKHOUSE_URL: *clickhouse_url

  server:
    image: ${TELMONI_IMAGE_SERVER:-ghcr.io/telmoni/server:latest}
    command: ["serve"]
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # The machine lanes' door — ingest, the read API, the CLI's sign-in and
    # Slack's events — for the reverse proxy on this host to forward to, on
    # the loopback interface alone: the console's lanes share the port,
    # behind the service secret, and are the console's to call. An SDK or
    # the CLI on this machine may use http://localhost:8082 directly.
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - telmoni-net
    environment:
      PORT: "8082"
      # One database, one role per module; a deployment that separates the
      # roles gives each module its own DSN.
      AUTH_DATABASE_URL: *database_url
      NOTIFICATIONS_DATABASE_URL: *database_url
      AGENT_DATABASE_URL: *database_url
      TELEMETRY_DATABASE_URL: *database_url
      TELEMETRY_CLICKHOUSE_URL: *clickhouse_url
      # The key each project's hashing key is sealed under; no default, since
      # one shipped here would be the same on every install.
      TELEMETRY_KEK: ${TELEMETRY_KEK:?set TELEMETRY_KEK in deploy/compose/.env as local:<openssl rand -hex 32>}
      # An ingest key of a project of your own: the console agent reports its
      # questions as runs through this server's own door, as any agent does;
      # empty for none.
      TELMONI_API_KEY: ${TELMONI_API_KEY:-}
      # The console's Redis, which ingest's claims and rate limits share.
      REDIS_URL: redis://redis:6379
      # The one reverse proxy in front appends the caller's address once;
      # the machine lanes' per-address limits read it there, as the console's
      # do. 0 when the server is reached directly.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in deploy/compose/.env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # The login form is on unless AUTH_DISABLE_USERNAME_PASSWORD; nobody
      # new signs up, at the form or
      # at a provider, unless AUTH_DISABLE_SIGNUP=false (an invited address
      # always may); ADMIN_EMAIL and ADMIN_PASSWORD seed the first account.
      # An OpenID Connect provider sits beside the form when
      # AUTH_CUSTOM_CLIENT_ID names one, and addresses at the domains of
      # AUTH_DOMAINS_WITH_SSO_ENFORCEMENT sign in there alone. Whether a new
      # person gets an organization, and whether anyone may create another,
      # is the `signup` feature flag.
      AUTH_DISABLE_SIGNUP: ${AUTH_DISABLE_SIGNUP:-true}
      VERIFY_EMAIL: ${VERIFY_EMAIL:-false}
      AUTH_DISABLE_USERNAME_PASSWORD: ${AUTH_DISABLE_USERNAME_PASSWORD:-false}
      AUTH_DOMAINS_WITH_SSO_ENFORCEMENT: ${AUTH_DOMAINS_WITH_SSO_ENFORCEMENT:-}
      # Where every person created starts: an organization's id and one of its
      # projects', each joined as a member unless its role is admin.
      TELMONI_DEFAULT_ORG_ID: ${TELMONI_DEFAULT_ORG_ID:-}
      TELMONI_DEFAULT_ORG_ROLE: ${TELMONI_DEFAULT_ORG_ROLE:-}
      TELMONI_DEFAULT_PROJECT_ID: ${TELMONI_DEFAULT_PROJECT_ID:-}
      TELMONI_DEFAULT_PROJECT_ROLE: ${TELMONI_DEFAULT_PROJECT_ROLE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:3000/auth/callback}
      AUTH_CUSTOM_CLIENT_ID: ${AUTH_CUSTOM_CLIENT_ID:-}
      AUTH_CUSTOM_CLIENT_SECRET: ${AUTH_CUSTOM_CLIENT_SECRET:-}
      AUTH_CUSTOM_ISSUER: ${AUTH_CUSTOM_ISSUER:-}
      AUTH_CUSTOM_NAME: ${AUTH_CUSTOM_NAME:-}
      AUTH_CUSTOM_SCOPE: ${AUTH_CUSTOM_SCOPE:-openid email profile}
      AUTH_CUSTOM_CHECKS: ${AUTH_CUSTOM_CHECKS:-pkce,nonce,state}
      AUTH_CUSTOM_ID_TOKEN_SIGNED_RESPONSE_ALG: ${AUTH_CUSTOM_ID_TOKEN_SIGNED_RESPONSE_ALG:-RS256}
      AUTH_CUSTOM_FETCH_USERINFO: ${AUTH_CUSTOM_FETCH_USERINFO:-false}
      AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING: ${AUTH_CUSTOM_ALLOW_ACCOUNT_LINKING:-false}
      # Where mail leaves by; unset, nothing is sent: one log line per mail, without its contents.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Telmoni <no-reply@localhost>}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # The connectors: a vendor app each, and the key that seals every
      # grant at rest. No default: a key written here would be the same on
      # every install, and a database dump would then open every grant.
      # `local:` is for a machine you control.
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      CONNECTOR_KEK: ${CONNECTOR_KEK:-}
      # The agent: `anthropic` or `openai` (the protocol), the model and its
      # key, and the embeddings the `ollama` service serves.
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-}
      AGENT_MODEL_URL: ${AGENT_MODEL_URL:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-http://ollama:11434/v1}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-nomic-embed-text}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      # The docs corpus the agent indexes: this stack's own console, over the
      # compose network, so it is the version you run; another corpus's URL,
      # or `off` for none.
      DOCS_CORPUS_URL: ${DOCS_CORPUS_URL:-http://web:3000/llms-full.txt}

  ollama:
    image: ollama/ollama:0.40.1
    profiles: ["agent"]
    restart: unless-stopped
    logging: *logging
    networks:
      - telmoni-net
    volumes:
      - ollama_models:/root/.ollama

  web:
    image: ${TELMONI_IMAGE_WEB:-ghcr.io/telmoni/web:latest}
    restart: unless-stopped
    logging: *logging
    # Loopback, for the reverse proxy on this host, as the server's 8082 is:
    # Docker publishes ahead of the host's firewall, and a caller reaching
    # the console directly writes its own address into the sign-in limits.
    # TELMONI_WEB_BIND=0.0.0.0 publishes it on every interface.
    ports:
      - "${TELMONI_WEB_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      server:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - telmoni-net
    # Distroless keeps `node` off PATH, and has no shell or curl.
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      PORT: "3000"
      NODE_ENV: production
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/compose/.env, 32 bytes or more}
      SERVICE_SECRET: ${SERVICE_SECRET:?set SERVICE_SECRET in deploy/compose/.env}
      SERVER_URL: http://server:8082
      REDIS_URL: redis://redis:6379
      # How many entries the proxy in front appends to X-Forwarded-For: the
      # console's per-address rate limits key on the one address no caller
      # wrote. This stack serves plain HTTP, so one reverse proxy terminating
      # TLS and appending the client's address is assumed; 0 when the console
      # is reached directly, which leaves those limits to the caller's word.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Seconds a trace's or a session's page, or a Sessions or Users list,
      # holds between redraws as its project's spans arrive; unset is 30, and
      # 0 draws on every export.
      LIVE_REFRESH_HOLD_SECS: ${LIVE_REFRESH_HOLD_SECS:-}
      # The identity provider's origins, space separated: signing out from the
      # account menu is a form post that ends in a redirect to the provider, and the console's
      # Content Security Policy lets the browser follow it there and nowhere
      # else (sign-in is a link, which the policy does not govern).
      AUTH_PROVIDER_ORIGINS: ${AUTH_PROVIDER_ORIGINS:-}
