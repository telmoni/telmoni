[package]
name        = "telmoni-server"
description = "The Telmoni server: auth, notifications, telemetry and the agent as modules of one process, with the migrator and the sweeps as subcommands of the same binary."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish                = false

# The library is the composition — what links the modules and wires the
# seams between them — so a binary built for another deployment can reuse
# it with its own identity provider, transport and modules. The binary is
# the command line over it.
[lib]
name = "telmoni_server"
path = "src/lib.rs"

# Undocumented: its rustdoc would land where the SDK's, the crate `telmoni`, does.
[[bin]]
name = "telmoni"
path = "src/main.rs"
doc  = false

[dependencies]
telmoni-shared        = { path = "../shared" }
telmoni-auth          = { path = "../auth" }
telmoni-notifications = { path = "../notifications" }
telmoni-agent         = { path = "../agent" }
telmoni-telemetry     = { path = "../telemetry" }
telmoni-migrator      = { path = "../migrator" }

anyhow     = { workspace = true }
async-trait = { workspace = true }
axum       = { workspace = true }
dotenvy    = { workspace = true }
hyper-util = { workspace = true }
mimalloc   = { workspace = true }
serde_json = { workspace = true }
sqlx       = { workspace = true }
tokio      = { workspace = true }
# The accept loop's per-connection service; `util` drives the composed
# router in-process in the tests (`ServiceExt::oneshot`).
tower      = { workspace = true, features = ["util"] }
tracing    = { workspace = true }

[lints]
workspace = true
