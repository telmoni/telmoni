[package]
name        = "telmoni-telemetry"
description = "Telemetry — each project's settings in Postgres, and its spans and their hourly rollup in ClickHouse, read only under a row policy naming the reader's projects."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish                = false

# A library: the `telmoni` binary links it beside auth and notifications, and
# the migrator applies its ClickHouse file and purges its partitions.
[lib]
name = "telmoni_telemetry"
path = "src/lib.rs"

[dependencies]
telmoni-shared = { path = "../shared" }

anyhow      = { workspace = true }
async-trait = { workspace = true }
# The console's lanes under `/internal/telemetry`.
axum        = { workspace = true }
chrono      = { workspace = true }
clickhouse  = { workspace = true }
# Ingest: an export's gzip, its OTLP messages, and the `Status` a refusal is.
flate2              = { workspace = true }
opentelemetry-proto = { workspace = true }
prost               = { workspace = true }
# What every replica shares: a claim on each export's digest, and the limits.
redis               = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# The digest of the ClickHouse file's statements, which a store keeps.
sha2        = { workspace = true }
sqlx        = { workspace = true }
# Every ClickHouse call's deadline on the client's side (`store::within`),
# beside the server's own.
tokio       = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
# Its `Url` parses a ClickHouse URL's user and password out of it, as a DSN
# carries them; the client sends them as headers, never in the URL.
reqwest     = { workspace = true }

[dev-dependencies]
tower          = { workspace = true, features = ["util"] }
http-body-util = "0.1"
# The door reached as a customer reaches it (`tests/sdk.rs`).
telmoni-sdk    = { path = "../../sdk/rust" }

[lints]
workspace = true
