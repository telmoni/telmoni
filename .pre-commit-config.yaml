# Pre-commit hooks for Telmoni.
# Install once: `pip install pre-commit && pre-commit install`
# Run on demand: `pre-commit run --all-files`

repos:
  # ── Cross-cutting hygiene ───────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^web/.+\.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^web/(package-lock\.json|tsconfig\.json)$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: detect-private-key

  # ── TypeScript / JavaScript (web/) ──────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^web/.+\.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^web/(package-lock\.json|\.next/|node_modules/)

  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && npx --no-install eslint'
        language: system
        files: ^web/.+\.(ts|tsx|js|jsx)$
        pass_filenames: true

  # ── Markdown ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        alias: prettier-md-root
        files: \.md$
        exclude: ^web/
