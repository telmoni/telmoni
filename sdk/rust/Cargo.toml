[package]
name = "telmoni"
# The SDKs' version, the same in all four and tagged `sdk/v…`; the workspace's
# `0.0.0` is the server's, and never this crate's.
version = "0.2.0"
edition.workspace = true
# The crate's own floor, not the workspace's pinned compiler: customers build it
# on theirs. Let chains need 1.88; clippy's incompatible_msrv holds std to it.
rust-version = "1.88"
# The second sentence meets whoever typed `cargo install telmoni`.
description = "Rust SDK for Telmoni: an agent's runs, steps, model calls and tool calls as OpenTelemetry spans. The telmoni command is the crate telmoni-cli."
repository = "https://github.com/telmoni/telmoni"
authors = ["Kendrick Lawton"]
license.workspace = true
readme = false
keywords = ["telmoni", "sdk", "opentelemetry", "agents"]
# The library and its license alone, what a build needs: its tests read the fixtures beside it, outside the crate.
include = ["/src", "/LICENSE"]

[dependencies]
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
# Blocking, because the span processor's thread is the SDK's own and runs no
# async runtime of the application's. The system's roots beside webpki's, so
# a private CA's ingest is reached as Go and Python reach it.
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
